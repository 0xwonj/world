[workspace]
members = [
    "crates/world-core",
    "crates/world-defs",
    "crates/world-authoring",
    "crates/world-standard",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
blake3 = { version = "1.8.5", default-features = false }
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
